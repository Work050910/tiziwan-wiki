<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanRail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="blueRail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="orangeRung" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>
  <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Network Waves / Signal Arcs -->
  <path d="M190 140 A80 80 0 0 1 322 140" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>
  <path d="M215 158 A50 50 0 0 1 297 158" fill="none" stroke="#00F2FE" stroke-width="6" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>

  <!-- Ladder Left Rail (Cyan Gradient) -->
  <line x1="175" y1="120" x2="175" y2="395" stroke="url(#cyanRail)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Ladder Right Rail (Blue Gradient) -->
  <line x1="337" y1="120" x2="337" y2="395" stroke="url(#blueRail)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Ladder Rungs -->
  <line x1="175" y1="175" x2="337" y2="175" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <line x1="175" y1="245" x2="337" y2="245" stroke="url(#orangeRung)" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="175" y1="315" x2="337" y2="315" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" opacity="0.9"/>

  <!-- Node Connection Pins -->
  <circle cx="175" cy="175" r="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="5"/>
  <circle cx="337" cy="175" r="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="5"/>
  <circle cx="175" cy="245" r="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="5"/>
  <circle cx="337" cy="245" r="13" fill="#FFFFFF" stroke="#F97316" stroke-width="5"/>
  <circle cx="175" cy="315" r="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="5"/>
  <circle cx="337" cy="315" r="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="5"/>

  <!-- Central Speed / Wiki Core Hub -->
  <circle cx="256" cy="245" r="22" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="256" cy="245" r="14" fill="#F97316"/>
  <circle cx="256" cy="245" r="6" fill="#FFFFFF"/>
</svg>